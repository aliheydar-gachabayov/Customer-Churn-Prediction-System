
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Churn Predictor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
}

.container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 24px;
}

header {
    text-align: center;
    margin-bottom: 32px;
}

h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin-bottom: 10px;
}

.subtitle {
    color: #94a3b8;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #334155;
}

.section {
    margin-bottom: 30px;
}

.section h2 {
    font-size: 19px;
    color: #38bdf8;
    border-bottom: 1px solid #334155;
    padding-bottom: 10px;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 13px;
    background: #0f172a;
    color: white;
    border: 1px solid #475569;
    border-radius: 9px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: 2px solid #38bdf8;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 15px;
    background: #38bdf8;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #082f49;
}

button:hover {
    background: #7dd3fc;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.result {
    display: none;
    margin-top: 28px;
    padding: 24px;
    border-radius: 12px;
    background: #0f172a;
    text-align: center;
}

.probability {
    font-size: 46px;
    font-weight: 800;
    margin: 12px 0;
}

.progress {
    height: 12px;
    background: #334155;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width .4s ease;
}

.message {
    margin-top: 15px;
    color: #cbd5e1;
}

.note {
    color: #94a3b8;
    font-size: 12px;
    margin-top: 14px;
}

.error {
    color: #fca5a5;
    margin-top: 14px;
    text-align: center;
}

.threshold-info {
    color: #94a3b8;
    font-size: 13px;
}

@media (max-width: 600px) {
    .container {
        margin: 20px auto;
        padding: 16px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }
}
</style>
</head>

<body>
<div class="container">

<header>
    <h1>Customer Churn Predictor</h1>
    <p class="subtitle">
        Machine Learning Powered Customer Risk Analysis
    </p>
</header>

<div class="card">

<form id="predictionForm">

<!-- CUSTOMER INFORMATION -->
<div class="section">
<h2>Customer Information</h2>

<div class="form-grid">

<div>
    <label for="gender">Gender</label>
    <select id="gender">
        <option value="Female">Female</option>
        <option value="Male">Male</option>
    </select>
</div>

<div>
    <label for="SeniorCitizen">Senior Citizen</label>
    <select id="SeniorCitizen">
        <option value="0">No</option>
        <option value="1">Yes</option>
    </select>
</div>

<div>
    <label for="Partner">Has Partner</label>
    <select id="Partner">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<div>
    <label for="Dependents">Has Dependents</label>
    <select id="Dependents">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<div>
    <label for="tenure">Customer Tenure (Months)</label>
    <input type="number" id="tenure"
        min="0" max="72" value="12" required>
</div>

</div>
</div>


<!-- SERVICES -->
<div class="section">
<h2>Subscribed Services</h2>

<div class="form-grid">

<div>
    <label for="PhoneService">Phone Service</label>
    <select id="PhoneService">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<div>
    <label for="MultipleLines">Multiple Lines</label>
    <select id="MultipleLines">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No phone service">No phone service</option>
    </select>
</div>

<div>
    <label for="InternetService">Internet Service</label>
    <select id="InternetService">
        <option value="Fiber optic">Fiber optic</option>
        <option value="DSL">DSL</option>
        <option value="No">No internet</option>
    </select>
</div>

<div>
    <label for="OnlineSecurity">Online Security</label>
    <select id="OnlineSecurity">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

<div>
    <label for="OnlineBackup">Online Backup</label>
    <select id="OnlineBackup">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

<div>
    <label for="DeviceProtection">Device Protection</label>
    <select id="DeviceProtection">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

<div>
    <label for="TechSupport">Technical Support</label>
    <select id="TechSupport">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

<div>
    <label for="StreamingTV">Streaming TV</label>
    <select id="StreamingTV">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

<div>
    <label for="StreamingMovies">Streaming Movies</label>
    <select id="StreamingMovies">
        <option value="No">No</option>
        <option value="Yes">Yes</option>
        <option value="No internet service">No internet service</option>
    </select>
</div>

</div>
</div>


<!-- BILLING -->
<div class="section">
<h2>Contract and Billing</h2>

<div class="form-grid">

<div>
    <label for="Contract">Contract Type</label>
    <select id="Contract">
        <option value="Month-to-month">Month-to-month</option>
        <option value="One year">One year</option>
        <option value="Two year">Two year</option>
    </select>
</div>

<div>
    <label for="PaperlessBilling">Paperless Billing</label>
    <select id="PaperlessBilling">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<div>
    <label for="PaymentMethod">Payment Method</label>
    <select id="PaymentMethod">
        <option value="Electronic check">Electronic check</option>
        <option value="Mailed check">Mailed check</option>
        <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
        <option value="Credit card (automatic)">Credit card (automatic)</option>
    </select>
</div>

<div>
    <label for="MonthlyCharges">Monthly Charges ($)</label>
    <input type="number" id="MonthlyCharges"
        min="0" step="0.01" value="75" required>
</div>

<div>
    <label for="TotalCharges">Total Charges ($)</label>
    <input type="number" id="TotalCharges"
        min="0" step="0.01" value="900" required>
</div>

</div>
</div>

<button type="submit" id="submitBtn">
    Predict Churn Risk
</button>

</form>

<p id="error" class="error" role="alert"></p>

<div id="result" class="result" aria-live="polite">
    <h2>Prediction Result</h2>

    <div id="probability" class="probability"></div>

    <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <p id="riskLevel"></p>
    <p id="message" class="message"></p>
    <p id="thresholdInfo" class="threshold-info"></p>

    <p class="note">
        This is an educational ML prediction,
        not a validated business decision tool.
    </p>
</div>

</div>
</div>

<script>
const form = document.getElementById("predictionForm");
const button = document.getElementById("submitBtn");
// ==========================================
// AUTOMATIC SERVICE VALIDATION
// ==========================================

const internetServiceFields = [
    "OnlineSecurity",
    "OnlineBackup",
    "DeviceProtection",
    "TechSupport",
    "StreamingTV",
    "StreamingMovies"
];

function updateInternetFields() {

    const internetService =
        document.getElementById("InternetService").value;

    internetServiceFields.forEach(fieldId => {

        const field = document.getElementById(fieldId);

        if (internetService === "No") {
            field.value = "No internet service";
            field.disabled = true;
        } else {
            field.disabled = false;

            if (field.value === "No internet service") {
                field.value = "No";
            }
        }
    });
}

function updatePhoneFields() {

    const phoneService =
        document.getElementById("PhoneService").value;

    const multipleLines =
        document.getElementById("MultipleLines");

    if (phoneService === "No") {
        multipleLines.value = "No phone service";
        multipleLines.disabled = true;
    } else {
        multipleLines.disabled = false;

        if (multipleLines.value === "No phone service") {
            multipleLines.value = "No";
        }
    }
}

document.getElementById("InternetService")
    .addEventListener("change", updateInternetFields);

document.getElementById("PhoneService")
    .addEventListener("change", updatePhoneFields);

updateInternetFields();
updatePhoneFields();

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const result = document.getElementById("result");
    const error = document.getElementById("error");

    result.style.display = "none";
    error.textContent = "";

    button.disabled = true;
    button.textContent = "Predicting...";

    const customer = {
        gender: document.getElementById("gender").value,
        SeniorCitizen: Number(document.getElementById("SeniorCitizen").value),
        Partner: document.getElementById("Partner").value,
        Dependents: document.getElementById("Dependents").value,
        tenure: Number(document.getElementById("tenure").value),
        PhoneService: document.getElementById("PhoneService").value,
        MultipleLines: document.getElementById("MultipleLines").value,
        InternetService: document.getElementById("InternetService").value,
        OnlineSecurity: document.getElementById("OnlineSecurity").value,
        OnlineBackup: document.getElementById("OnlineBackup").value,
        DeviceProtection: document.getElementById("DeviceProtection").value,
        TechSupport: document.getElementById("TechSupport").value,
        StreamingTV: document.getElementById("StreamingTV").value,
        StreamingMovies: document.getElementById("StreamingMovies").value,
        Contract: document.getElementById("Contract").value,
        PaperlessBilling: document.getElementById("PaperlessBilling").value,
        PaymentMethod: document.getElementById("PaymentMethod").value,
        MonthlyCharges: Number(document.getElementById("MonthlyCharges").value),
        TotalCharges: Number(document.getElementById("TotalCharges").value)
    };

    try {
        const response = await fetch("/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(customer)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail
                    ? JSON.stringify(data.detail)
                    : "Prediction request failed"
            );
        }

        const percentage = data.churn_probability * 100;

        document.getElementById("probability").textContent =
            percentage.toFixed(1) + "%";

        document.getElementById("progressFill").style.width =
            percentage + "%";

        document.getElementById("riskLevel").textContent =
            data.risk_level + " Churn Risk";

        document.getElementById("message").textContent =
            data.prediction === 1
                ? "The model predicts this customer may churn."
                : "The model predicts this customer is less likely to churn.";

        document.getElementById("thresholdInfo").textContent =
            "Decision threshold: " +
            (data.threshold * 100).toFixed(0) + "%";

        result.style.display = "block";

    } catch (err) {
        error.textContent = "Unable to generate prediction: " + err.message;
        console.error(err);
    } finally {
        button.disabled = false;
        button.textContent = "Predict Churn Risk";
    }
});
</script>

</body>
</html>
